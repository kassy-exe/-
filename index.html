<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ねたい実用検定</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface2: #21262D;
    --blue: #4F9CF9;
    --gold: #FFD700;
    --text: #E6EDF3;
    --muted: #8B949E;
    --danger: #FF6B6B;
    --success: #3FB950;
    --border: #30363D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    user-select: none;
  }

  /* ===== TOP PAGE ===== */
  #top-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .logo {
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--gold);
    margin-bottom: 0.25rem;
  }

  .logo span { color: var(--blue); }

  .subtitle {
    font-size: 0.95rem;
    color: var(--muted);
    margin-bottom: 3rem;
    letter-spacing: 0.05em;
  }

  .grade-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1rem;
    width: 100%;
    max-width: 640px;
    margin-bottom: 2.5rem;
  }

  .grade-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 0.75rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .grade-card:hover {
    border-color: var(--blue);
    background: var(--surface2);
  }

  .grade-card.selected {
    border-color: var(--gold);
    background: var(--surface2);
  }

  .grade-num {
    font-size: 1.75rem;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
  }

  .grade-label {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }

  .grade-count {
    font-size: 0.65rem;
    color: var(--blue);
    margin-top: 0.2rem;
  }

  .name-input-wrap {
    width: 100%;
    max-width: 320px;
    margin-bottom: 1.5rem;
  }

  .name-input-wrap label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .name-input-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s;
  }

  .name-input-wrap input:focus {
    border-color: var(--blue);
  }

  .start-btn {
    background: var(--gold);
    color: #0D1117;
    border: none;
    border-radius: 8px;
    padding: 0.9rem 3rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .start-btn:hover { opacity: 0.85; }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ===== EXAM PAGE ===== */
  #exam-page { display: none; }

  .exam-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
  }

  .exam-title {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--gold);
  }

  .exam-meta {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .progress-bar-bg {
    width: 120px;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .progress-text {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .cheat-counter {
    font-size: 0.75rem;
    color: var(--danger);
    font-weight: 700;
  }

  .cheat-counter.safe { color: var(--muted); }

  /* ===== CHEAT WARNING ===== */
  #cheat-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,107,107,0.15);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  #cheat-overlay.show { display: flex; }

  .cheat-modal {
    background: var(--surface);
    border: 2px solid var(--danger);
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
    max-width: 360px;
    width: 90%;
  }

  .cheat-modal h2 {
    color: var(--danger);
    font-size: 1.4rem;
    margin-bottom: 0.75rem;
  }

  .cheat-modal p {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.7;
    margin-bottom: 1.5rem;
  }

  .cheat-modal .remaining {
    font-size: 1.1rem;
    color: var(--text);
    font-weight: 700;
    margin-bottom: 1.25rem;
  }

  .cheat-dismiss {
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.75rem 2rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* ===== QUESTION ===== */
  .question-wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 6rem;
  }

  .q-number {
    font-size: 0.75rem;
    color: var(--blue);
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 0.75rem;
  }

  .q-type-badge {
    display: inline-block;
    font-size: 0.65rem;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.15rem 0.5rem;
    margin-left: 0.5rem;
    vertical-align: middle;
  }

  .q-text {
    font-size: 1.05rem;
    font-weight: 500;
    line-height: 1.75;
    margin-bottom: 2rem;
    color: var(--text);
  }

  /* 選択問題 */
  .choices { display: flex; flex-direction: column; gap: 0.75rem; }

  .choice-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.95rem;
    line-height: 1.5;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
  }

  .choice-btn:hover:not(:disabled) {
    border-color: var(--blue);
    background: var(--surface2);
  }

  .choice-btn.selected {
    border-color: var(--gold);
    background: var(--surface2);
  }

  .choice-label {
    font-weight: 700;
    color: var(--gold);
    min-width: 1.2rem;
    font-size: 0.85rem;
    margin-top: 0.05rem;
  }

  /* 記述問題 */
  .essay-wrap textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.95rem;
    line-height: 1.7;
    resize: vertical;
    min-height: 120px;
    outline: none;
    transition: border-color 0.15s;
  }

  .essay-wrap textarea:focus {
    border-color: var(--blue);
  }

  .essay-hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.5rem;
  }

  /* ===== NAV ===== */
  .nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }

  .nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 1.5rem;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .nav-btn:hover:not(:disabled) { border-color: var(--blue); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .nav-btn.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
    font-weight: 700;
  }

  .nav-btn.primary:hover:not(:disabled) { opacity: 0.85; }

  .nav-btn.submit {
    background: var(--gold);
    border-color: var(--gold);
    color: #0D1117;
    font-weight: 700;
  }

  /* ===== RESULT PAGE ===== */
  #result-page {
    display: none;
    min-height: 100vh;
    padding: 3rem 1.5rem;
  }

  .result-inner {
    max-width: 680px;
    margin: 0 auto;
  }

  .result-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .result-grade {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .result-name {
    font-size: 1.1rem;
    color: var(--text);
    margin-bottom: 1.5rem;
  }

  .result-score-wrap {
    margin-bottom: 1rem;
  }

  .result-score {
    font-size: 4rem;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
  }

  .result-score span {
    font-size: 1.5rem;
    color: var(--muted);
    font-weight: 400;
  }

  .result-verdict {
    font-size: 1.1rem;
    font-weight: 700;
    margin-top: 0.75rem;
  }

  .result-verdict { color: var(--muted); }
  .result-verdict.pass { color: var(--success); }
  .result-verdict.fail { color: var(--danger); }

  .cheat-warning-result {
    background: rgba(255,107,107,0.1);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 0.8rem;
    color: var(--danger);
    margin-top: 1rem;
  }

  .review-section { margin-top: 2rem; }

  .review-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 0.75rem;
  }

  .review-item.correct { border-left: 3px solid var(--success); }
  .review-item.wrong { border-left: 3px solid var(--danger); }
  .review-item.essay { border-left: 3px solid var(--blue); }

  .review-q-num {
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  .review-q-text {
    font-size: 0.9rem;
    color: var(--text);
    margin-bottom: 0.75rem;
    line-height: 1.6;
  }

  .review-answer-row {
    display: flex;
    gap: 1rem;
    font-size: 0.8rem;
    flex-wrap: wrap;
  }

  .review-your {
    color: var(--danger);
  }

  .review-your.ok { color: var(--success); }

  .review-correct-ans {
    color: var(--success);
  }

  .review-essay-ans {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.5rem;
    line-height: 1.6;
  }

  .retry-btn {
    display: block;
    margin: 2.5rem auto 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.8rem 2.5rem;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .retry-btn:hover { border-color: var(--blue); }

  /* ===== TERMINATED PAGE ===== */
  #terminated-page {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    flex-direction: column;
  }

  .terminated-icon {
    font-size: 4rem;
    margin-bottom: 1rem;
  }

  .terminated-title {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--danger);
    margin-bottom: 0.75rem;
  }

  .terminated-desc {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.7;
    max-width: 340px;
    margin-bottom: 2rem;
  }
</style>
</head>
<body>

<!-- TOP PAGE -->
<div id="top-page">
  <div class="logo">ねたい<span>検定</span></div>
  <div class="subtitle">実用ねたい力検定</div>

  <div class="grade-grid">
    <div class="grade-card" onclick="selectGrade(5)">
      <div class="grade-num">5</div>
      <div class="grade-label">級</div>
      <div class="grade-count">20問</div>
    </div>
    <div class="grade-card" onclick="selectGrade(4)">
      <div class="grade-num">4</div>
      <div class="grade-label">級</div>
      <div class="grade-count">25問</div>
    </div>
    <div class="grade-card" onclick="selectGrade(3)">
      <div class="grade-num">3</div>
      <div class="grade-label">級</div>
      <div class="grade-count">30問</div>
    </div>
    <div class="grade-card" onclick="selectGrade(2)">
      <div class="grade-num">2</div>
      <div class="grade-label">級</div>
      <div class="grade-count">35問</div>
    </div>
    <div class="grade-card" onclick="selectGrade(1)">
      <div class="grade-num">1</div>
      <div class="grade-label">級</div>
      <div class="grade-count">40問</div>
    </div>
  </div>

  <div class="name-input-wrap">
    <label>名前を入力してください</label>
    <input type="text" id="name-input" placeholder="例：かっしー" oninput="updateStartBtn()">
    <div style="font-size:0.72rem;color:var(--danger);margin-top:0.4rem;">※ 誰だか認識できる名前でないと無効となります</div>
  </div>

  <button class="start-btn" id="start-btn" onclick="startExam()" disabled>検定を開始する</button>
</div>

<!-- EXAM PAGE -->
<div id="exam-page">
  <div class="exam-header">
    <div class="exam-title" id="exam-title-label">ねたい検定 〇級</div>
    <div class="exam-meta">
      <div class="progress-wrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="progress-text" id="progress-text">1 / 20</div>
      </div>
      <div class="cheat-counter safe" id="cheat-counter">離脱: 0/3</div>
    </div>
  </div>

  <div class="question-wrap" id="question-wrap"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prev-btn" onclick="prevQ()" disabled>← 前へ</button>
    <button class="nav-btn primary" id="next-btn" onclick="nextQ()">次へ →</button>
    <button class="nav-btn submit" id="submit-btn" onclick="submitExam()" style="display:none">提出する</button>
  </div>
</div>

<!-- CHEAT OVERLAY -->
<div id="cheat-overlay">
  <div class="cheat-modal">
    <h2>⚠️ 離脱を検知</h2>
    <p>別のタブやウィンドウへの切り替えを検知しました。<br>これはカンニング行為とみなされます。</p>
    <div class="remaining" id="cheat-remaining">残り警告: 2回</div>
    <button class="cheat-dismiss" onclick="dismissCheat()">試験に戻る</button>
  </div>
</div>

<!-- RESULT PAGE -->
<div id="result-page">
  <div class="result-inner">
    <div class="result-header">
      <div class="result-grade" id="result-grade-label"></div>
      <div class="result-name" id="result-name-label"></div>
      <div class="result-score-wrap">
        <div class="result-score" id="result-score">0<span> / 100</span></div>
      </div>
      <div class="result-verdict" id="result-verdict"></div>
      <div class="cheat-warning-result" id="cheat-warning-result" style="display:none"></div>
    </div>

    <div class="review-section">
      <div class="review-title">問題の振り返り</div>
      <div id="review-list"></div>
    </div>

    <button class="retry-btn" onclick="backToTop()">トップに戻る</button>
  </div>
</div>

<!-- ADMIN PAGE -->
<div id="admin-page" style="display:none; min-height:100vh; padding:2rem 1.5rem;">
  <div style="max-width:780px;margin:0 auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:1rem;">
      <div style="font-size:1.1rem;font-weight:700;color:var(--gold);">管理者画面 — 受験一覧</div>
      <button class="nav-btn" onclick="closeAdmin()">← 戻る</button>
    </div>
    <div id="admin-list"></div>
  </div>
</div>

<!-- TERMINATED PAGE -->
<div id="terminated-page" style="display:flex; display:none;">
  <div class="terminated-icon">🚫</div>
  <div class="terminated-title">試験を強制終了しました</div>
  <div class="terminated-desc">
    タブ・ウィンドウの離脱が3回検知されたため、<br>
    この試験は無効となりました。<br>
    最初からやり直してください。
  </div>
  <button class="retry-btn" onclick="backToTop()">トップに戻る</button>
</div>

<script>
// ===== 問題データ =====
const QUESTIONS = {
  5: [
    { type:'choice', text:'ねたいの最初のリーダーは誰？', choices:['かっしー','しゅうと','古賀','稲場'], answer:2 },
    { type:'choice', text:'ねたい史上初めてできた会社は？', choices:['かっしー銀行','稲場商事','OI銀行','古賀クリーン'], answer:3 },
    { type:'choice', text:'ねたいで最初に使われた通貨の名前は？', choices:['パト','ケン','トキ','円'], answer:2 },
    { type:'choice', text:'トキはもともと何に使われていた？', choices:['給料の支払い','車両予想の賭け','会社間の取引','税金の支払い'], answer:1 },
    { type:'choice', text:'トキを最初に通貨として提案したのは？', choices:['かっしー','稲場','生田','古賀'], answer:3 },
    { type:'choice', text:'トキの管理をしていた銀行は？', choices:['OI銀行','かっしー銀行','しゅうと銀行','SK銀行'], answer:1 },
    { type:'choice', text:'サボり隊が使っていた通貨の名前は？', choices:['トキ','パト','ケン','円'], answer:2 },
    { type:'choice', text:'サボり隊の通貨を発行していた銀行は？', choices:['かっしー銀行','OI銀行','しゅうと銀行','古賀銀行'], answer:2 },
    { type:'choice', text:'サボり隊の通貨の弱点は？', choices:['重すぎて持ち運べない','紙製でコピーによる偽造がしやすい','価値が低すぎた','使える場所が少なかった'], answer:1 },
    { type:'choice', text:'トキが禁止されるきっかけになった出来事は？', choices:['偽造が発覚した','3組の先生に見つかった','かっしー銀行が倒産した','しゅうとが持ち逃げした'], answer:1 },
    { type:'choice', text:'トキが禁止された後に作られた通貨は？', choices:['ケン','円','パト','新トキ'], answer:2 },
    { type:'choice', text:'パトを作ったのはどの2つの銀行？', choices:['かっしー銀行とSK銀行','OI銀行としゅうと銀行','かっしー銀行とOI銀行','SK銀行とOI銀行'], answer:2 },
    { type:'choice', text:'ねたいのルール違反をした場合の罰則は？', choices:['ねたいから追放','罰金を請求される','罰ゲームをする','リーダーに謝る'], answer:1 },
    { type:'choice', text:'警察官がルール違反をした場合の処分は？', choices:['罰金のみ','追放のみ','罰金＋警察退職','一般会員と同じ罰金'], answer:2 },
    { type:'choice', text:'サボり隊を結成したのは誰？', choices:['生田','しゅうと','岡野','目﨑'], answer:1 },
    { type:'choice', text:'ねたいとサボり隊が一時合体した時のグループ名は？', choices:['ねたいα','だらだらたい','連合隊','合体隊'], answer:1 },

// ===== STATE =====
let selectedGrade = null;
let userName = '';
let questions = [];
let currentQ = 0;
let answers = [];
let cheatCount = 0;
const MAX_CHEAT = 3;
let examActive = false;

// ===== UI =====
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzEVA4XatMUlLTlkiRk-lFMp4hOWWt2EtaT5UyBqzWXiMIceKXHi2My2uSEX1va2OyI/exec';
function selectGrade(g) {
  selectedGrade = g;
  document.querySelectorAll('.grade-card').forEach((c,i) => {
    c.classList.toggle('selected', (5-i) === g);
  });
  updateStartBtn();
}

function updateStartBtn() {
  const name = document.getElementById('name-input').value.trim();
  const isAdmin = name === 'netaigr2024';
  document.getElementById('start-btn').disabled = !(isAdmin || (selectedGrade && name));
}

function startExam() {
  userName = document.getElementById('name-input').value.trim();

  if (userName === 'netaigr2024') {
    document.getElementById('top-page').style.display = 'none';
    document.getElementById('admin-page').style.display = 'block';
    renderAdminList();
    return;
  }

  questions = QUESTIONS[selectedGrade];
  answers = new Array(questions.length).fill(null);
  currentQ = 0;
  cheatCount = 0;
  examActive = true;

  document.getElementById('top-page').style.display = 'none';
  document.getElementById('exam-page').style.display = 'block';
  document.getElementById('exam-title-label').textContent = `ねたい検定 ${selectedGrade}級`;

  renderQuestion();
  setupCheatDetection();
}

function renderQuestion() {
  const q = questions[currentQ];
  const total = questions.length;
  const pct = ((currentQ + 1) / total * 100).toFixed(0);

  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${currentQ+1} / ${total}`;

  const wrap = document.getElementById('question-wrap');

  if (q.type === 'choice') {
    const labels = ['A','B','C','D'];
    wrap.innerHTML = `
      <div class="q-number">問 ${currentQ+1} <span class="q-type-badge">選択</span></div>
      <div class="q-text">${q.text}</div>
      <div class="choices">
        ${q.choices.map((c,i) => `
          <button class="choice-btn ${answers[currentQ] === i ? 'selected' : ''}"
            onclick="selectChoice(${i})">
            <span class="choice-label">${labels[i]}</span>
            <span>${c}</span>
          </button>
        `).join('')}
      </div>
    `;
  } else {
    wrap.innerHTML = `
      <div class="q-number">問 ${currentQ+1} <span class="q-type-badge">記述</span></div>
      <div class="q-text">${q.text}</div>
      <div class="essay-wrap">
        <textarea placeholder="ここに答えを記述してください..." oninput="saveEssay(this.value)">${answers[currentQ] || ''}</textarea>
        <div class="essay-hint">※ 記述問題は採点者が確認します</div>
      </div>
    `;
  }

  // nav
  document.getElementById('prev-btn').disabled = currentQ === 0;
  const isLast = currentQ === total - 1;
  document.getElementById('next-btn').style.display = isLast ? 'none' : 'inline-block';
  document.getElementById('submit-btn').style.display = isLast ? 'inline-block' : 'none';
}

function selectChoice(i) {
  answers[currentQ] = i;
  renderQuestion();
}

function saveEssay(val) {
  answers[currentQ] = val;
}

function prevQ() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
}

function nextQ() {
  if (currentQ < questions.length - 1) { currentQ++; renderQuestion(); }
}

function submitExam() {
  examActive = false;
  removeCheatDetection();
  showResult();
}

// ===== CHEAT DETECTION =====
function setupCheatDetection() {
  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('blur', onWindowBlur);
  document.addEventListener('contextmenu', e => e.preventDefault());
}

function removeCheatDetection() {
  document.removeEventListener('visibilitychange', onVisibilityChange);
  window.removeEventListener('blur', onWindowBlur);
}

function onVisibilityChange() {
  if (!examActive) return;
  if (document.hidden) triggerCheat();
}

function onWindowBlur() {
  if (!examActive) return;
  triggerCheat();
}

function triggerCheat() {
  cheatCount++;
  updateCheatCounter();

  if (cheatCount >= MAX_CHEAT) {
    examActive = false;
    removeCheatDetection();
    document.getElementById('cheat-overlay').classList.remove('show');
    document.getElementById('exam-page').style.display = 'none';
    const tp = document.getElementById('terminated-page');
    tp.style.display = 'flex';
    return;
  }

  const remaining = MAX_CHEAT - cheatCount;
  document.getElementById('cheat-remaining').textContent = `残り警告: ${remaining}回`;
  document.getElementById('cheat-overlay').classList.add('show');
}

function dismissCheat() {
  document.getElementById('cheat-overlay').classList.remove('show');
}

function updateCheatCounter() {
  const el = document.getElementById('cheat-counter');
  el.textContent = `離脱: ${cheatCount}/${MAX_CHEAT}`;
  el.className = cheatCount > 0 ? 'cheat-counter' : 'cheat-counter safe';
}

// ===== RESULT =====
async function showResult() {
  document.getElementById('exam-page').style.display = 'none';
  document.getElementById('result-page').style.display = 'block';

  document.getElementById('result-grade-label').textContent = `ねたい実用検定 ${selectedGrade}級`;
  document.getElementById('result-name-label').textContent = `${userName} さんの結果`;

  // スコア欄は非表示
  document.getElementById('result-score').style.display = 'none';

  const verdict = document.getElementById('result-verdict');
  verdict.textContent = '受験完了！後日、採点結果の紙をお渡しします。';
  verdict.className = 'result-verdict';
  verdict.style.color = 'var(--blue)';

  if (cheatCount > 0) {
    const cw = document.getElementById('cheat-warning-result');
    cw.style.display = 'block';
    cw.textContent = `⚠️ 試験中に ${cheatCount} 回の離脱が検知されました`;
  }

  // 受験データ保存
  await saveResult();

  // review（受験者には回答のみ表示、正誤・参考答案は非表示）
  const list = document.getElementById('review-list');
  list.innerHTML = questions.map((q, i) => {
    if (q.type === 'choice') {
      const labels = ['A','B','C','D'];
      const userAns = answers[i];
      const userLabel = userAns !== null ? labels[userAns] : '未回答';
      return `
        <div class="review-item">
          <div class="review-q-num">問${i+1}（選択）</div>
          <div class="review-q-text">${q.text}</div>
          <div class="review-answer-row">
            <span style="color:var(--blue)">あなたの回答: ${userLabel}）${userAns !== null ? q.choices[userAns] : '未回答'}</span>
          </div>
        </div>
      `;
    } else {
      return `
        <div class="review-item essay">
          <div class="review-q-num">問${i+1}（記述）</div>
          <div class="review-q-text">${q.text}</div>
          <div class="review-answer-row">
            <span style="color:var(--blue)">あなたの回答: ${answers[i] || '（未記入）'}</span>
          </div>
        </div>
      `;
    }
  }).join('');
}

// ===== データ保存 =====
async function saveResult() {
  const record = {
    id: Date.now(),
    name: userName,
    grade: selectedGrade,
    date: new Date().toLocaleString('ja-JP'),
    cheatCount,
    answers: answers.map((a, i) => {
      const q = questions[i];
      if (q.type === 'choice') {
        const labels = ['A','B','C','D'];
        return {
          type: 'choice',
          q: q.text,
          userAns: a !== null ? `${labels[a]}）${q.choices[a]}` : '未回答',
          correctAns: `${labels[q.answer]}）${q.choices[q.answer]}`,
          correct: a === q.answer
        };
      } else {
        return {
          type: 'essay',
          q: q.text,
          userAns: a || '（未記入）',
          refAns: q.answer
        };
      }
    })
  };

  try {
    const response = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'add', result: record })
    });
    const data = await response.json();
    if (!data.success) throw new Error(data.error || data.message);
  } catch (error) {
    console.error('結果保存エラー:', error);
    alert('結果の保存に失敗しました。\nインターネット接続を確認してください。');
  }
}

// ===== 管理者ページ =====
// ===== 管理者ページ =====
function openAdmin() {
  const pw = prompt('管理者パスワードを入力してください');
  if (pw !== 'netaigr2024') {
    alert('パスワードが違います');
    return;
  }
  document.getElementById('top-page').style.display = 'none';
  document.getElementById('admin-page').style.display = 'block';
  renderAdminList();
}

async function renderAdminList() {
  try {
    const response = await fetch(GAS_API_URL);
    const data = await response.json();
    if (!data.success) throw new Error(data.error || '結果取得に失敗しました');

    const results = data.results;
    const container = document.getElementById('admin-list');

    if (results.length === 0) {
      container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:2rem;">まだ受験データがありません</div>';
      return;
    }

    // 新しい順
    const sorted = [...results].reverse();

    container.innerHTML = sorted.map(r => {
      const choiceAns = r.answers.filter(a => a.type === 'choice');
      const correct = choiceAns.filter(a => a.correct).length;
      const total = choiceAns.length;

      return `
        <div class="admin-card" onclick="toggleDetail(${r.id})">
          <div class="admin-card-header">
            <div>
              <span class="admin-name">${r.name}</span>
              <span class="admin-grade">${r.grade}級</span>
              ${r.cheatCount > 0 ? `<span class="admin-cheat">離脱${r.cheatCount}回</span>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:1rem;">
              <span style="font-size:0.8rem;color:var(--muted);">${r.date}</span>
              <span style="font-size:0.85rem;color:var(--gold);font-weight:700;">選択 ${correct}/${total}</span>
            </div>
          </div>
          <div class="admin-detail" id="detail-${r.id}" style="display:none;">
            ${r.answers.map((a, i) => {
              if (a.type === 'choice') {
                return `
                  <div class="admin-ans-row ${a.correct ? 'correct' : 'wrong'}">
                    <div class="admin-ans-q">問${i+1}（選択）${a.q}</div>
                    <div class="admin-ans-user">回答: ${a.userAns}</div>
                    ${!a.correct ? `<div class="admin-ans-correct">正解: ${a.correctAns}</div>` : ''}
                  </div>
                `;
              } else {
                return `
                  <div class="admin-ans-row essay">
                    <div class="admin-ans-q">問${i+1}（記述）${a.q}</div>
                    <div class="admin-ans-user">回答: ${a.userAns}</div>
                    <div class="admin-ans-ref">参考答案: ${a.refAns}</div>
                  </div>
                `;
              }
            }).join('')}
            <button class="delete-btn" onclick="deleteResult(event, ${r.id})">この記録を削除</button>
          </div>
        </div>
      `;
    }).join('');
  } catch (error) {
    console.error('結果取得エラー:', error);
    alert('結果データを取得できませんでした。\n' + error.message);
  }
}

function toggleDetail(id) {
  const el = document.getElementById(`detail-${id}`);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function deleteResult(e, id) {
  e.stopPropagation();
  if (!confirm('この記録を削除しますか？')) return;

  try {
    const response = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id: id })
    });
    const data = await response.json();
    if (!data.success) throw new Error(data.error || data.message);
    await renderAdminList();
  } catch (error) {
    console.error('削除エラー:', error);
    alert('結果の削除に失敗しました。\n' + error.message);
  }
}

function closeAdmin() {
  document.getElementById('admin-page').style.display = 'none';
  document.getElementById('top-page').style.display = 'flex';
}

function backToTop() {
  document.getElementById('result-page').style.display = 'none';
  document.getElementById('terminated-page').style.display = 'none';
  document.getElementById('top-page').style.display = 'flex';
  document.querySelectorAll('.grade-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('name-input').value = '';
  document.getElementById('start-btn').disabled = true;
  selectedGrade = null;
  examActive = false;
}
</script>
